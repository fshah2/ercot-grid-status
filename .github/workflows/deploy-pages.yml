name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  # Data commits are pushed with GITHUB_TOKEN, which does NOT trigger `push` workflows.
  # Redeploy after every successful data refresh instead.
  workflow_run:
    workflows: ["Update ERCOT data (every 15 minutes)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run checks out the commit that *started* the data run by default;
          # deploy the latest main so the freshly committed data is included.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm install

      - name: Build (static export)
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /ercot-grid-status
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
